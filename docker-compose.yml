# Local development. Plain HTTP on :8000 — see docker-compose.prod.yml for HTTPS.

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Everything is stored as naive UTC. The analytics heatmap groups by
      # weekday and hour and is wrong if the server shifts timestamps.
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: cafetrack
      MYSQL_USER: cafetrack
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucafetrack", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: cafetrack
      DB_USERNAME: cafetrack
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FRONTEND_BASE_URL: http://localhost:3000
      REQUIRE_QR_TOKEN: "true"
      SEED_ON_BOOT: "true"
      # Set APP_KEY in a .env file; `php artisan key:generate --show` prints one.
      APP_KEY: ${APP_KEY:-}
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysql-data:
