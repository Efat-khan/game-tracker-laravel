# Production. Caddy terminates TLS and obtains certificates automatically.
#
#   CAFETRACK_DOMAIN=cafetrack.example.com \
#   APP_KEY=base64:… DB_PASSWORD=… JWT_SECRET=… \
#   docker compose -f docker-compose.prod.yml up -d

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cafetrack}
      MYSQL_USER: ${DB_USERNAME:-cafetrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-cafetrack}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Not published: only the app talks to it.

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_URL: https://${CAFETRACK_DOMAIN:?set CAFETRACK_DOMAIN}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-cafetrack}
      DB_USERNAME: ${DB_USERNAME:-cafetrack}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL_HOURS: "12"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?set FRONTEND_BASE_URL}
      REQUIRE_QR_TOKEN: "true"
      RATE_LIMIT_CHECKIN: "10"
      RATE_LIMIT_LOGIN: "10"
      RATE_LIMIT_PUBLIC_STATION: "120"
      CORS_ALLOWED_ORIGINS: ${FRONTEND_BASE_URL}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CAFETRACK_DOMAIN: ${CAFETRACK_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Caddy serves the static files; PHP goes to the app container.
      - ./public:/var/www/html/public:ro
    depends_on:
      - app

volumes:
  mysql-data:
  app-storage:
  caddy-data:
  caddy-config:
